<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="50%" stop-color="#0c0a09" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="core-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg-grad)" stroke="#292524" stroke-width="6" />

  <!-- Inner Ambient Glow Ring -->
  <circle cx="256" cy="270" r="190" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.15" />

  <!-- Outer Wave 3 -->
  <path d="M 120 180 A 170 170 0 0 1 392 180" fill="none" stroke="url(#ring-grad)" stroke-width="26" stroke-linecap="round" opacity="0.9" filter="url(#glow)" />

  <!-- Mid Wave 2 -->
  <path d="M 160 215 A 120 120 0 0 1 352 215" fill="none" stroke="url(#ring-grad)" stroke-width="26" stroke-linecap="round" opacity="0.95" />

  <!-- Inner Wave 1 -->
  <path d="M 200 250 A 70 70 0 0 1 312 250" fill="none" stroke="url(#ring-grad)" stroke-width="26" stroke-linecap="round" />

  <!-- Center Glowing Core / Node -->
  <circle cx="256" cy="315" r="28" fill="url(#core-grad)" filter="url(#glow)" />
  <circle cx="256" cy="315" r="14" fill="#ffffff" />

  <!-- Small Active Pulse Indicator -->
  <circle cx="395" cy="115" r="12" fill="#10b981" filter="url(#glow)" />
  <circle cx="395" cy="115" r="6" fill="#ffffff" />
</svg>
